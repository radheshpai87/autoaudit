version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/weights:/app/weights
    environment:
      - INFERENCE_MODE=auto
      - YOLO_WEIGHTS_PATH=weights/best.pt
      - CONFIDENCE_THRESHOLD=0.35
      - UNKNOWN_ANOMALY_THRESHOLD=0.55
      - DATABASE_URL=${DATABASE_URL:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-}
      - AWS_S3_PRESIGNED_URL_TTL=${AWS_S3_PRESIGNED_URL_TTL:-3600}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
